name: CI

on:
  push:
    branches:
      - main
      - feature/gh-6-get-dotenv-8
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck without emit
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Type surface tests
        run: npm run typecheck

      - name: Tests with coverage
        run: npm test -- --coverage

      - name: Unused-code check
        run: npm run knip

      - name: Documentation
        run: npm run docs

      - name: Bundle dependency boundaries
        run: npm run verify:bundle

      - name: Packed runtime without optional peer
        run: npm run verify:package

      - name: Packed strict TypeScript consumer
        run: npm run verify:types

      - name: Built-entry smoke test
        run: npm run verify:smoke

      - name: Package dry run
        run: npm run pack:dry
